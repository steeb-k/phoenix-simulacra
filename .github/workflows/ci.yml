name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run's verdict irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned by commit SHA rather than tag, matching the
      # cargo-deny workflow: a tag can be moved to point at different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Windows, not Linux: VSS, WinFsp mounting and the virtdisk VHD APIs are
      # the substance of this project. A Linux job would compile a fraction of
      # it. openssl-sys and wayland-sys appear in Cargo.lock but are non-Windows
      # only and never build here (ureq uses native-tls, which is SChannel on
      # Windows); zstd-sys builds from source against the runner's MSVC.
      #
      # phoenix-cli and phoenix-gui both default to the `winfsp` feature, whose
      # winfsp-sys generates bindings with bindgen at build time. Per
      # docs/BUILDING.md that needs LLVM/libclang plus the WinFsp SDK headers.
      - name: Install WinFsp
        run: choco install winfsp --no-progress -y

      # Fail with a clear message here rather than inside an opaque bindgen
      # error. winfsp-sys's build script locates the SDK *only* through
      # HKLM\SOFTWARE\WOW6432Node\WinFsp (see docs/ARM64.md); the x64 MSI
      # populates that key.
      - name: Verify build prerequisites
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\WinFsp'
          if (-not (Test-Path $key)) { throw "WinFsp registry key $key is missing; winfsp-sys cannot locate the SDK." }
          $dir = (Get-ItemProperty $key).InstallDir
          if (-not (Test-Path (Join-Path $dir 'inc'))) { throw "WinFsp SDK headers not found under $dir (install lacks the developer feature)." }
          Write-Host "WinFsp SDK: $dir"

          $llvm = 'C:\Program Files\LLVM'
          if (-not (Test-Path "$llvm\bin\libclang.dll")) {
            Write-Host "libclang not preinstalled; installing LLVM."
            choco install llvm --no-progress -y
          }
          "LIBCLANG_PATH=$llvm\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "LIBCLANG_PATH=$llvm\bin"

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Split from the test step so a compile failure is distinguishable from a
      # test failure at a glance. --locked makes a stale Cargo.lock a CI failure
      # instead of a silent re-resolve, which is the same supply-chain property
      # cargo-deny is there to protect.
      - name: Build
        run: cargo build --workspace --locked --all-targets

      # Plain `cargo test` deliberately: the Tier 2 system tests in
      # phoenix-systests drive real VHDs through diskpart and need an elevated
      # shell, so they are #[ignore]d in-tree and stay skipped here. See
      # docs/TESTING.md for how to run them on a real machine.
      - name: Test
        run: cargo test --workspace --locked
